name: MrBeast Subscriber Tracker

on:
  schedule:
    - cron: '49 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests matplotlib pandas -q
      - name: Scrape & log
        run: |
          python3 - <<'EOF'
          import requests, re, os, csv
          from datetime import datetime, timezone
          headers = {'User-Agent': 'Mozilla/5.0', 'Accept-Language': 'en-US'}
          r = requests.get('https://www.youtube.com/@MrBeast', headers=headers, timeout=20)
          count, formatted = None, None
          for pat in [r'"subscriberCountText":\{"simpleText":"([^"]+)"']:
              m = re.search(pat, r.text)
              if m:
                  raw = m.group(1).strip()
                  num = raw.lower().replace(' subscribers','').replace(',','').strip()
                  if 'm' in num: count = int(float(num.replace('m',''))*1_000_000)
                  formatted = raw.replace(' subscribers','').strip()
                  break
          ts = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          os.makedirs('data', exist_ok=True)
          exists = os.path.exists('data/subscribers_log.csv')
          with open('data/subscribers_log.csv','a',newline='') as f:
              w = csv.writer(f)
              if not exists: w.writerow(['timestamp','subscriber_count','formatted_count'])
              w.writerow([ts, count, formatted])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f"SUB_FORMATTED={formatted}\n")
          EOF
      - name: Generate trend PDF
        run: |
          python3 - <<'EOF'
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          import matplotlib.dates as mdates
          import pandas as pd
          import os
          from datetime import datetime, timezone

          os.makedirs('reports', exist_ok=True)
          df = pd.read_csv('data/subscribers_log.csv')
          df['timestamp'] = pd.to_datetime(df['timestamp'])
          df['subscriber_count'] = pd.to_numeric(df['subscriber_count'], errors='coerce')
          df = df.dropna(subset=['subscriber_count'])
          df = df[df['subscriber_count'] > 0].reset_index(drop=True)
          print(f"Valid data points: {len(df)}")

          fig, ax = plt.subplots(figsize=(12, 6))
          if len(df) == 0:
              ax.text(0.5, 0.5, 'No valid data yet', ha='center', va='center',
                      transform=ax.transAxes, fontsize=14, color='gray')
          else:
              ax.plot(df['timestamp'], df['subscriber_count']/1_000_000,
                      color='#FF0000', linewidth=2, marker='o',
                      markersize=6, markerfacecolor='white', markeredgewidth=2)
              if len(df) > 1:
                  ax.fill_between(df['timestamp'], df['subscriber_count']/1_000_000,
                                  alpha=0.1, color='#FF0000')
              latest = df.iloc[-1]
              ax.annotate(f"{latest['subscriber_count']/1_000_000:.2f}M",
                          xy=(latest['timestamp'], latest['subscriber_count']/1_000_000),
                          xytext=(10,10), textcoords='offset points',
                          fontsize=10, color='#FF0000', fontweight='bold')
              ax.xaxis.set_major_formatter(mdates.DateFormatter('%m-%d %H:%M'))
              plt.xticks(rotation=45, ha='right')

          ax.set_title('MrBeast YouTube Subscriber Trend', fontsize=18, fontweight='bold', pad=20)
          ax.set_xlabel('Date / Time (UTC)', fontsize=12)
          ax.set_ylabel('Subscribers (Millions)', fontsize=12)
          ax.grid(True, linestyle='--', alpha=0.5)
          plt.figtext(0.99, 0.01, f"Last updated: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}",
                      ha='right', fontsize=8, color='gray')
          plt.tight_layout()
          pdf_path = f"reports/{datetime.now(timezone.utc).strftime('%Y-%m-%d_%H-%M-%S')}.pdf"
          plt.savefig(pdf_path, format='pdf', bbox_inches='tight', dpi=150)
          print(f"PDF saved: {pdf_path}")
          EOF
      - name: Commit & push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git add -A
          git diff --cached --quiet || git commit -m "data: ${{ env.SUB_FORMATTED }} subscribers at $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin claude
